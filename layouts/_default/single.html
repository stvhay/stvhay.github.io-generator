{{- define "main" }}
  <section class="container">
    <article class="article card">
      <h1>{{ .Title }}</h1>
      {{- partial "date.html" . }}
      {{- /* Hero image is above the fold — load eagerly. */}}
      {{- partial "thumb.html" (dict "page" . "class" "article-img" "eager" true) }}
      {{ .Content }}
    </article>
  </section>
  {{- partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
{{- end }}
