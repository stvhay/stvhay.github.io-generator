# htmltest configuration for Hugo static site testing
# Documentation: https://github.com/wjdp/htmltest
#
# htmltest validates internal links and HTML structure only — fast and
# offline, so it runs in the default pytest suite on every commit.
# External links are checked separately by lychee (lychee.toml) on a
# schedule (.github/workflows/external-links.yml), which knows how to
# treat bot-blocked 403/429 responses as alive instead of ignoring
# those URLs entirely.

# Directory containing HTML files to test
DirectoryPath: "public"

# Check all internal links work correctly
CheckInternalLinks: true

# Check internal hash anchors (e.g., #section-id) resolve correctly
CheckInternalHash: true

# External links are lychee's job (see header comment)
CheckExternal: false

# Verify all images have alt attributes. Empty alt text is valid for decorative
# card art and is covered by tests/test_responsive_images.py.
CheckImages: true
IgnoreAltEmpty: true

# Check script tags reference valid files
CheckScripts: true

# Ensure favicon is present
CheckFavicon: true

# Verify meta refresh tags have valid URLs
CheckMetaRefresh: true

# Ignore Hugo-generated taxonomy pages (often empty by design)
# Also ignore cns/ (generated homework content with matplotlib plots lacking alt text)
IgnoreDirs:
  - "categories"
  - "tags"
  - "cns"

# Log level: 0=errors only, 1=warnings, 2=info, 3=debug
LogLevel: 1
