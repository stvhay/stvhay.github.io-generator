name: website

on:
  push:
    branches:
      - main

# Serialize deploys: parallel runs race on the publish push, and the
# loser fails on a non-fast-forward. Queue instead of cancelling so
# every push still deploys.
concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: stvhay-github-io
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.WEBSITE_SSH_KEY }}

      - name: Build and test
        run: |
          nix develop --command bash -c '
            ./build
            pytest
          '

      - name: Publish website
        # The message is passed through the environment, never interpolated
        # into the script: ${{ }} substitutes literal text before the shell
        # runs, so a message containing quotes (or worse) would break out of
        # the -m argument and into the script.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          if git -C public diff --cached --quiet; then
            echo "No site changes to publish"
          else
            git -C public commit -m "$COMMIT_MESSAGE"
            git -C public push
          fi
